name: Docker

on:
  push:
    branches: [ krusta4711_version_mminks_PR_195 ]
    tags:
      - krusta/ism7mqtt_fork:v0.0.19_plus_mminks_PR_195_commit_d7b408f

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get tag
      id: repository
      run: echo "tag=$(git describe --tags HEAD)" >> $GITHUB_OUTPUT
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build
      uses: docker/build-push-action@v5
      with:
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: krusta/ism7mqtt_fork:v0.0.19_plus_mminks_PR_195_commit_d7b408f
        labels: krusta/ism7mqtt_fork:v0.0.19_plus_mminks_PR_195_commit_d7b408f